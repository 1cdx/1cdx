[versions]
agp = "8.13.0"
kotlin = "2.2.20"
sora = "0.23.6"
coreKtx = "1.15.0"
activity = "1.10.1"
lifecycle = "2.8.7"
recyclerview = "1.4.0"
coroutines = "1.10.2"
junit = "4.13.2"
jsch = "2.28.8"
bouncycastle = "1.87"
gson = "2.11.0"
sshd = "2.17.1"
eddsa = "0.3.0"
slf4j = "2.0.17"

[libraries]
sora-bom = { group = "io.github.Rosemoe.sora-editor", name = "bom", version.ref = "sora" }
sora-editor = { group = "io.github.Rosemoe.sora-editor", name = "editor" }
sora-textmate = { group = "io.github.Rosemoe.sora-editor", name = "language-textmate" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
jsch = { group = "com.github.mwiede", name = "jsch", version.ref = "jsch" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
sshd-core = { group = "org.apache.sshd", name = "sshd-core", version.ref = "sshd" }
sshd-sftp = { group = "org.apache.sshd", name = "sshd-sftp", version.ref = "sshd" }
eddsa = { group = "net.i2p.crypto", name = "eddsa", version.ref = "eddsa" }
slf4j-nop = { group = "org.slf4j", name = "slf4j-nop", version.ref = "slf4j" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
