name: Release APK

# Setiap push ke main: tentukan versi berikutnya, build APK release yang sudah
# ditandatangani, lalu buat tag + GitHub Release berisi APK.
#
# Naik versi (default patch). Tulis di pesan commit untuk mengubah:
#   [major]  -> X+1.0.0
#   [minor]  -> X.Y+1.0
#   [skip release] -> tidak membuat release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tentukan versi berikutnya
        id: version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="0.1.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            if [[ "$COMMIT_MSG" == *"[major]"* ]]; then
              next="$((major + 1)).0.0"
            elif [[ "$COMMIT_MSG" == *"[minor]"* ]]; then
              next="$major.$((minor + 1)).0"
            else
              next="$major.$minor.$((patch + 1))"
            fi
          fi
          IFS=. read -r major minor patch <<< "$next"
          code=$((major * 1000000 + minor * 1000 + patch))
          echo "Versi: v$next (versionCode $code), tag sebelumnya: ${latest:-tidak ada}"
          echo "name=$next" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Pasang keystore dari secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum di-set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}

      - name: Siapkan aset release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/1cdx-v${{ steps.version.outputs.name }}.apk"
          # Nama tetap agar link /releases/latest/download/1cdx.apk selalu valid
          cp app/build/outputs/apk/release/app-release.apk dist/1cdx.apk
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Verifikasi tanda tangan APK
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs dist/1cdx.apk

      - name: Buat tag dan GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.name }}"
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "1cdx $tag" \
            --generate-notes \
            --latest

      - name: Hapus keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
